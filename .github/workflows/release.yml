name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Verify tag matches package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, tomllib
          from openscn import __version__
          with open("pyproject.toml", "rb") as f:
              package_version = tomllib.load(f)["project"]["version"]
          assert os.environ["RELEASE_TAG"] == "v" + package_version
          assert __version__ == package_version
          PY
      - run: python -m pip install . build twine
      - run: python -m unittest discover -s tests -v
      - run: python examples/demo.py
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Write checksums
        run: sha256sum dist/* > dist/SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --title "OpenSCN $RELEASE_TAG" --prerelease --notes-file docs/release-notes.md
